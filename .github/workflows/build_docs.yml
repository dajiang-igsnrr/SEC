# Workflow to build and deploy API docs for MESC
name: Build docs

# Controls when the workflow will run
on:
  # Triggers the workflow on pushes to the "main" branch, i.e., PR merges
  push:
    branches: [ "main"]

  # Triggers the workflow on pushes to open pull requests to main with documentation changes
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build_docs.yml'
      - '**.md'
      - 'src/*.f90'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel jobs running if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No write permission by default
permissions: {}

# Workflow run - one or more jobs that can run sequentially or in parallel
jobs:
  # The first job in this workflow builds the documentation for the website
  build-docs:
    name: build docs
    if: github.ref != 'refs/heads/main'

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Terminate the job if it runs for more than 5 minutes
    timeout-minutes: 5

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Install Graphviz (Required by FORD)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout MESC repository
        with:
          persist-credentials: true
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build docs with FORD
        run: ford mesc.md
